# Source of truth for the Xcode project. Run `make gen`; Kotoba.xcodeproj, App/Info.plist and
# App/Kotoba.entitlements are generated and gitignored.
name: Kotoba
options:
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  KotobaCore:
    path: KotobaCore
  KotobaProviders:
    path: KotobaProviders
  KotobaStorage:
    path: KotobaStorage
  # Auto-update (MIT, see NOTICE). docs/release.md covers keys, signing and the appcast.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
settings:
  base:
    MARKETING_VERSION: "0.4.2"
    CURRENT_PROJECT_VERSION: "8"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    # Every build, Debug included, is signed with the same Developer ID so TCC grants and
    # Keychain access survive rebuilds. The keychain also holds another team's identity: keep the full name.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application: Mubin Ansari (7U6G55576W)"
    DEVELOPMENT_TEAM: 7U6G55576W
    ENABLE_HARDENED_RUNTIME: YES
targets:
  Kotoba:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - Kotoba.entitlements
    dependencies:
      - package: KotobaCore
      - package: KotobaProviders
      - package: KotobaStorage
      - package: Sparkle
    scheme: {}
    settings:
      base:
        # The executable and kotoba.app keep this name in both configurations (Makefile and scripts use it).
        PRODUCT_NAME: kotoba
        # The release identity: Sparkle updates, TCC grants, UserDefaults and the Keychain item of every install
        # hang on it, so it never changes. `scripts/verify-release.sh` checks it.
        PRODUCT_BUNDLE_IDENTIFIER: tech.teensy.kotoba
        APP_DISPLAY_NAME: kotoba
        # App/AppIcon.icon (Icon Composer, light and dark); sources and generator in design/icon/.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      # Debug builds (`make build`, `make check`, `make snapshots`) are a second install with their own bundle id, so
      # they never share the release's UserDefaults, data folder, Keychain item, TCC grants or login item
      # (`App/Install.swift`). `scripts/check-dev-install.sh` fails the build if this goes.
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: tech.teensy.kotoba.dev
          APP_DISPLAY_NAME: kotoba Dev
          # A blue icon with a "DEV" band, so the Dock and ⌘-Tab tell it from the release (design/icon/).
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDev
          # The release icon too, for the README images (`HomeModel.Identity.release`).
          ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
    info:
      path: App/Info.plist
      properties:
        # Privacy & Security, Login Items and the About panel show this name: "kotoba Dev" for a Debug build.
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleName: $(APP_DISPLAY_NAME)
        # Without these two XcodeGen writes 1.0 and 1. Sparkle compares CFBundleVersion: raise it by one each release.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Every launch starts as an agent, out of the Dock, so a launch with "Show in Dock" off never shows the icon;
        # `App/DockAndMenuBar.swift` makes kotoba a Dock app as the first step of the launch (story 35).
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        # The allocator's space-efficient mode (libmalloc: "policies usually associated with memory-constrained
        # platforms (iOS) that trade some amount of time efficiency for space efficiency"). On macOS a third-party
        # process otherwise never gives freed segments back, so what a window's SwiftUI peak frees stays in the
        # footprint until quit: `make window-memory` 68.8 -> 41.3 MB after close (median of 5), 8.5 -> 6.1 MB at launch
        # (docs/research/memory-spike.md, "Memory after use"). Launch Services sets it at each launch (Finder, Dock,
        # login, Sparkle relaunch); a binary started from the shell does not get it.
        LSEnvironment:
          MallocSpaceEfficient: "1"
        # Sparkle (docs/release.md). The private key for this public key is in the owner's login Keychain,
        # account "kotoba". Checks run once a day (Sparkle's default); General settings turns them off.
        SUFeedURL: https://github.com/shiroyasha9/kotoba/releases/latest/download/appcast.xml
        SUPublicEDKey: 5+WnPWDrVij+klCwXcC2yRKjFuGNSOigdRUu8T1BDvc=
        SUEnableAutomaticChecks: true
        NSMicrophoneUsageDescription: kotoba records your voice while you dictate and sends the audio to the speech provider you chose.
    entitlements:
      path: App/Kotoba.entitlements
      properties:
        com.apple.security.device.audio-input: true

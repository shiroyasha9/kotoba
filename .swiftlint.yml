# Strict: `make lint` runs `swiftlint lint --strict`, so every warning fails the build.
included:
  - App
  - KotobaCore/Sources
  - KotobaCore/Tests
  - KotobaCore/Package.swift
  - KotobaProviders/Sources
  - KotobaProviders/Tests
  - KotobaProviders/Package.swift
  - KotobaStorage/Sources
  - KotobaStorage/Tests
  - KotobaStorage/Package.swift
excluded:
  - KotobaCore/.build-*
  - KotobaProviders/.build-*
  - KotobaStorage/.build-*
  - KotobaCore/.build
  - KotobaProviders/.build
  - KotobaStorage/.build
  - build

# swift-format owns layout: it adds trailing commas to multi-line collections and puts `{`
# on its own line after a wrapped signature or condition list.
disabled_rules:
  - trailing_comma
  - opening_brace

opt_in_rules:
  - force_unwrapping
  - implicitly_unwrapped_optional
  - fatal_error_message
  - discouraged_optional_boolean
  - unowned_variable_capture
  - unhandled_throwing_task
  - weak_delegate
  - discarded_notification_center_observer
  - legacy_objc_type
  - empty_count
  - first_where
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - sorted_first_last
  - toggle_bool
  - redundant_nil_coalescing
  - identical_operands
  - yoda_condition
  - shorthand_optional_binding
  - prefer_self_in_static_references
  - convenience_type
  - strict_fileprivate
  - unavailable_function

force_try: error
force_cast: error
force_unwrapping: error
line_length:
  warning: 120
  ignores_comments: true
identifier_name:
  excluded: [id, at, to, x, y, ok]

custom_rules:
  no_print:
    name: "No print"
    regex: "\\b(print|debugPrint|dump|NSLog)\\s*\\("
    match_kinds: identifier
    message: "Log with os.Logger (see CODING_STANDARDS.md)."
    severity: error
  no_fixed_sleep:
    name: "No fixed sleep"
    regex: "(\\bThread\\.sleep|(?<![.\\w])(?<!func )(usleep|nanosleep|sleep)\\s*\\(|\\.asyncAfter\\s*\\()"
    message: "No fixed waits. React to an event; for a real timeout, sleep on the injected PipelineClock."
    severity: error
  no_task_sleep_in_core:
    name: "No Task.sleep in KotobaCore"
    included: ["KotobaCore/Sources/.*\\.swift"]
    regex: "\\bTask\\.sleep\\b"
    message: "KotobaCore takes time from the PipelineClock port so tests control it."
    severity: error
  no_banned_frameworks:
    name: "No SwiftData, CoreData or WebKit"
    regex: "^\\s*(@\\w+\\s+)*import\\s+(SwiftData|CoreData|WebKit)\\b"
    message: "kotoba uses system SQLite and has no web views (docs/spec.md)."
    severity: error
  core_is_pure_swift:
    name: "KotobaCore stays platform-free"
    included: ["KotobaCore/Sources/.*\\.swift"]
    regex: "^\\s*(@\\w+\\s+)*import\\s+((typealias|struct|class|enum|protocol|let|var|func)\\s+)?(?!(Foundation|os|Synchronization)\\b)\\w+"
    message: "KotobaCore imports only Foundation, os and Synchronization. Platform code lives in App/ behind a port."
    severity: error
  providers_are_foundation_only:
    name: "KotobaProviders stays platform-free"
    included: ["KotobaProviders/Sources/.*\\.swift"]
    regex: "^\\s*(@\\w+\\s+)*import\\s+((typealias|struct|class|enum|protocol|let|var|func)\\s+)?(?!(Foundation|os|Synchronization|KotobaCore)\\b)\\w+"
    message: "KotobaProviders imports only Foundation, os, Synchronization and KotobaCore, so `swift test` covers it. Keychain and other platform code live in App/."
    severity: error
  storage_is_sqlite_only:
    name: "KotobaStorage stays UI-free"
    included: ["KotobaStorage/Sources/.*\\.swift"]
    regex: "^\\s*(@\\w+\\s+)*import\\s+((typealias|struct|class|enum|protocol|let|var|func)\\s+)?(?!(Foundation|os|Synchronization|SQLite3|KotobaCore)\\b)\\w+"
    message: "KotobaStorage imports only Foundation, os, Synchronization, SQLite3 and KotobaCore, so `swift test` covers it. UI lives in App/."
    severity: error
  no_shared_urlsession:
    name: "No URLSession.shared"
    regex: "\\bURLSession\\s*\\.\\s*shared\\b"
    message: "Each TranscriptionProvider owns one long-lived URLSession."
    severity: error
  keychain_store_construction:
    name: "KeychainStore construction"
    regex: "\\bKeychainStore\\s*\\("
    excluded_match_kinds: [comment, doccomment, string]
    message: "Read and save keys through KeyVault, so a saved key always replaces the copy the router reads."
    severity: error
  url_session_construction:
    name: "URLSession construction"
    regex: "\\bURLSession\\s*\\("
    excluded_match_kinds: [comment, doccomment, string]
    message: "One long-lived URLSession per provider, built in its init; a session per request costs a TLS handshake. Mark that one line with `// swiftlint:disable:next url_session_construction`."
    severity: error
  # CODING_STANDARDS.md "User-facing text" rules 3, 5 and 8, on UI strings in App/ only: strings on a line that
  # builds UI (Text(, Button(, NSMenuItem(title:, .toolTip = …) and every string in App/StatusText.swift.
  # Log strings are not on such lines, so they never trip these rules.
  ui_text_ellipsis:
    name: "UI text: one-character ellipsis"
    included: ["App/.*\\.swift"]
    regex: "(?<=(?:\\b(?:Text|Button|Toggle|Section|Label|Picker|LabeledContent|Link|Menu|TextField|SecureField|GroupBox|NSMenuItem|NSButton|NSTextField|NSAlert|MenuChoice|help|navigationTitle|confirmationDialog|alert)\\(|\\.(?:title|subtitle|toolTip|messageText|informativeText|placeholderString|stringValue|prompt) = )[^\\n]{0,200})\\.\\.\\."
    match_kinds: [string]
    message: "Use the one-character ellipsis \"…\", only on an item that opens a window or asks for more input (CODING_STANDARDS.md, User-facing text 3)."
    severity: error
  ui_text_internal_terms:
    name: "UI text: no internal terms"
    included: ["App/.*\\.swift"]
    regex: "(?<=(?:\\b(?:Text|Button|Toggle|Section|Label|Picker|LabeledContent|Link|Menu|TextField|SecureField|GroupBox|NSMenuItem|NSButton|NSTextField|NSAlert|MenuChoice|help|navigationTitle|confirmationDialog|alert)\\(|\\.(?:title|subtitle|toolTip|messageText|informativeText|placeholderString|stringValue|prompt) = )[^\\n]{0,200})(?i:\\b(?:routes?|keyterms?|ZDR|zero-data-retention|needsSetup|untested|(?:microsoft|x-ai|openai|google)/[\\w.-]+)\\b)"
    match_kinds: [string]
    message: "No internal terms in UI text: route, keyterm, ZDR, zero-data-retention, needsSetup, untested, model slugs (CODING_STANDARDS.md, User-facing text 5)."
    severity: error
  ui_text_dash:
    name: "UI text: no \" - \" between phrases"
    included: ["App/.*\\.swift"]
    regex: "(?<=(?:\\b(?:Text|Button|Toggle|Section|Label|Picker|LabeledContent|Link|Menu|TextField|SecureField|GroupBox|NSMenuItem|NSButton|NSTextField|NSAlert|MenuChoice|help|navigationTitle|confirmationDialog|alert)\\(|\\.(?:title|subtitle|toolTip|messageText|informativeText|placeholderString|stringValue|prompt) = )[^\\n]{0,200}) - "
    match_kinds: [string]
    message: "No \" - \" between phrases in UI text: two sentences, a colon, or \"·\" before a value (CODING_STANDARDS.md, User-facing text 8)."
    severity: error
  ui_text_straight_quotes:
    name: "UI text: curly apostrophe and quotes"
    included: ["App/.*\\.swift"]
    regex: "(?<=(?:\\b(?:Text|Button|Toggle|Section|Label|Picker|LabeledContent|Link|Menu|TextField|SecureField|GroupBox|NSMenuItem|NSButton|NSTextField|NSAlert|MenuChoice|help|navigationTitle|confirmationDialog|alert)\\(|\\.(?:title|subtitle|toolTip|messageText|informativeText|placeholderString|stringValue|prompt) = )[^\\n]{0,200})(?:'|\\\\\")"
    match_kinds: [string]
    message: "Use the curly apostrophe and quotes (’ “ ”) in UI text, not ' or \\\" (CODING_STANDARDS.md, User-facing text 13)."
    severity: error
  status_text_straight_quotes:
    name: "Status text: curly apostrophe and quotes"
    included: ["App/StatusText\\.swift"]
    regex: "(?:'|\\\\\")"
    match_kinds: [string]
    message: "Use the curly apostrophe and quotes (’ “ ”) in pill and menu text, not ' or \\\" (CODING_STANDARDS.md, User-facing text 13)."
    severity: error
  status_text_ellipsis:
    name: "Status text: one-character ellipsis"
    included: ["App/StatusText\\.swift"]
    regex: "\\.\\.\\."
    match_kinds: [string]
    message: "Use the one-character ellipsis \"…\" (CODING_STANDARDS.md, User-facing text 3)."
    severity: error
  status_text_internal_terms:
    name: "Status text: no internal terms"
    included: ["App/StatusText\\.swift"]
    regex: "(?i:\\b(?:routes?|keyterms?|ZDR|zero-data-retention|needsSetup|untested|(?:microsoft|x-ai|openai|google)/[\\w.-]+)\\b)"
    match_kinds: [string]
    message: "No internal terms in pill or menu text (CODING_STANDARDS.md, User-facing text 5)."
    severity: error
  status_text_dash:
    name: "Status text: no \" - \" between phrases"
    included: ["App/StatusText\\.swift"]
    regex: " - "
    match_kinds: [string]
    message: "No \" - \" between phrases in pill or menu text (CODING_STANDARDS.md, User-facing text 8)."
    severity: error

# Strict: `make lint` runs `swiftlint lint --strict`, so every warning fails the build.
included:
  - App
  - KotobaCore/Sources
  - KotobaCore/Tests
  - KotobaCore/Package.swift
  - KotobaProviders/Sources
  - KotobaProviders/Tests
  - KotobaProviders/Package.swift
  - KotobaStorage/Sources
  - KotobaStorage/Tests
  - KotobaStorage/Package.swift
excluded:
  - KotobaCore/.build-*
  - KotobaProviders/.build-*
  - KotobaStorage/.build-*
  - KotobaCore/.build
  - KotobaProviders/.build
  - KotobaStorage/.build
  - build

# swift-format owns layout: it adds trailing commas to multi-line collections and puts `{`
# on its own line after a wrapped signature or condition list.
disabled_rules:
  - trailing_comma
  - opening_brace

opt_in_rules:
  - force_unwrapping
  - implicitly_unwrapped_optional
  - fatal_error_message
  - discouraged_optional_boolean
  - unowned_variable_capture
  - unhandled_throwing_task
  - weak_delegate
  - discarded_notification_center_observer
  - legacy_objc_type
  - empty_count
  - first_where
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - sorted_first_last
  - toggle_bool
  - redundant_nil_coalescing
  - identical_operands
  - yoda_condition
  - shorthand_optional_binding
  - prefer_self_in_static_references
  - convenience_type
  - strict_fileprivate
  - unavailable_function

# A page not on the 0.5.0 page system yet disables the page rules for the whole file (the ratchet line, CODING_STANDARDS.md
# "Pages"); `superfluous_disable_command` fails a line that hides nothing, and `scripts/ratchet-done.sh` fails the release
# while one remains.
blanket_disable_command:
  allowed_rules: [ui_layout_literal, appkit_layout_literal, ui_layout_constant, ui_divider, ui_fixed_color,
    row_is_page_row, page_form]

force_try: error
force_cast: error
force_unwrapping: error
line_length:
  warning: 120
  ignores_comments: true
identifier_name:
  excluded: [id, at, to, x, y, ok]

custom_rules:
  no_print:
    name: "No print"
    regex: "\\b(print|debugPrint|dump|NSLog)\\s*\\("
    match_kinds: identifier
    message: "Log with os.Logger (see CODING_STANDARDS.md)."
    severity: error
  no_fixed_sleep:
    name: "No fixed sleep"
    regex: "(\\bThread\\.sleep|(?<![.\\w])(?<!func )(usleep|nanosleep|sleep)\\s*\\(|\\.asyncAfter\\s*\\()"
    message: "No fixed waits. React to an event; for a real timeout, sleep on the injected PipelineClock."
    severity: error
  no_task_sleep_in_core:
    name: "No Task.sleep in KotobaCore"
    included: ["KotobaCore/Sources/.*\\.swift"]
    regex: "\\bTask\\.sleep\\b"
    message: "KotobaCore takes time from the PipelineClock port so tests control it."
    severity: error
  no_banned_frameworks:
    name: "No SwiftData, CoreData or WebKit"
    regex: "^\\s*(@\\w+\\s+)*import\\s+(SwiftData|CoreData|WebKit)\\b"
    message: "kotoba uses system SQLite and has no web views (docs/spec.md)."
    severity: error
  core_is_pure_swift:
    name: "KotobaCore stays platform-free"
    included: ["KotobaCore/Sources/.*\\.swift"]
    regex: "^\\s*(@\\w+\\s+)*import\\s+((typealias|struct|class|enum|protocol|let|var|func)\\s+)?(?!(Foundation|os|Synchronization)\\b)\\w+"
    message: "KotobaCore imports only Foundation, os and Synchronization. Platform code lives in App/ behind a port."
    severity: error
  providers_are_foundation_only:
    name: "KotobaProviders stays platform-free"
    included: ["KotobaProviders/Sources/.*\\.swift"]
    regex: "^\\s*(@\\w+\\s+)*import\\s+((typealias|struct|class|enum|protocol|let|var|func)\\s+)?(?!(Foundation|os|Synchronization|KotobaCore)\\b)\\w+"
    message: "KotobaProviders imports only Foundation, os, Synchronization and KotobaCore, so `swift test` covers it. Keychain and other platform code live in App/."
    severity: error
  storage_is_sqlite_only:
    name: "KotobaStorage stays UI-free"
    included: ["KotobaStorage/Sources/.*\\.swift"]
    regex: "^\\s*(@\\w+\\s+)*import\\s+((typealias|struct|class|enum|protocol|let|var|func)\\s+)?(?!(Foundation|os|Synchronization|SQLite3|KotobaCore)\\b)\\w+"
    message: "KotobaStorage imports only Foundation, os, Synchronization, SQLite3 and KotobaCore, so `swift test` covers it. UI lives in App/."
    severity: error
  no_shared_urlsession:
    name: "No URLSession.shared"
    regex: "\\bURLSession\\s*\\.\\s*shared\\b"
    message: "Each TranscriptionProvider owns one long-lived URLSession."
    severity: error
  keychain_store_construction:
    name: "KeychainStore construction"
    regex: "\\bKeychainStore\\s*\\("
    excluded_match_kinds: [comment, doccomment, string]
    message: "Read and save keys through KeyVault, so a saved key always replaces the copy the router reads."
    severity: error
  # A development build is a second install (App/Install.swift): every name it must not share with the release
  # derives from the bundle id there. A bundle id written anywhere else would point a dev build at release data.
  per_install_ids:
    name: "Per-install names: bundle id"
    excluded: ["App/Install\\.swift"]
    regex: "tech\\.teensy\\.kotoba(?:\\.dev)?(?![.\\w])"
    match_kinds: [string]
    message: "Take the bundle id, Keychain service or log subsystem from `Install` (App/) or `Log.subsystem` (packages), so a development build never shares the release's names."
    severity: error
  per_install_locations:
    name: "Per-install names: data folder and Keychain service"
    excluded:
      - "App/AppFiles\\.swift"
      - "App/KeychainStore\\.swift"
      # Reads Wispr Flow's folders, not kotoba's.
      - "KotobaStorage/Sources/KotobaStorage/WisprFlowImport\\.swift"
    regex: "\\b(?:applicationSupportDirectory|libraryDirectory|homeDirectoryForCurrentUser|NSHomeDirectory|kSecAttrService|suiteName)\\b"
    excluded_match_kinds: [comment, doccomment, string]
    message: "Name kotoba's files through `AppFiles` and its keys through `KeychainStore`, so a development build keeps its own data folder and Keychain item (App/Install.swift). No UserDefaults suite: the standard domain follows the bundle id."
    severity: error
  url_session_construction:
    name: "URLSession construction"
    regex: "\\bURLSession\\s*\\("
    excluded_match_kinds: [comment, doccomment, string]
    message: "One long-lived URLSession per provider, built in its init; a session per request costs a TLS handshake. Mark that one line with `// swiftlint:disable:next url_session_construction`."
    severity: error
  window_front:
    name: "Window to the front"
    included: ["App/.*\\.swift"]
    excluded: ["App/WindowFront\\.swift"]
    regex: "\\b(NSApp|NSApplication\\.shared)\\.activate\\(|\\bmakeKeyAndOrderFront\\("
    excluded_match_kinds: [comment, doccomment, string]
    message: "Call `WindowFront.activate()` first in the click handler (before building the window or an `await`), then `WindowFront.show(window)`: macOS can refuse a late activation request, and then only `orderFrontRegardless` keeps the window in front of the other app."
    severity: error
  activation_policy:
    name: "Activation policy"
    included: ["App/.*\\.swift"]
    excluded: ["App/DockAndMenuBar\\.swift", "App/Snapshots\\.swift"]
    regex: "\\bsetActivationPolicy\\("
    excluded_match_kinds: [comment, doccomment, string]
    message: "Only `DockAndMenuBar` sets the activation policy (story 35), so the Dock icon follows the settings and the open windows; the snapshot run sets `.prohibited`."
    severity: error
  # The clipboard has one writer too: a Pasteboard port write or restore (only a restore call has the
  # `ifChangeCount:` label), an AppKit pasteboard write, or a second `SystemPasteboard` (the pipeline's is the
  # `pasteboard:` port in AppDelegate) outside the clipboard's own files.
  one_paste_path:
    name: "One paste path"
    regex: "\\bClipboardGuard\\b|\\.(?:sendPaste|sendReturn|sendBackspaces|writeTransient|clearContents|prepareForNewContents|writeObjects|declareTypes|setString|setData|setPropertyList)\\s*\\(|\\bifChangeCount\\s*:|\\bpasteboard\\??\\.write\\s*\\(|(?<!pasteboard: )\\bSystemPasteboard\\s*\\("
    excluded: ["KotobaCore/Sources/KotobaCore/ClipboardPaste\\.swift", "KotobaCore/Sources/KotobaCore/ClipboardGuard\\.swift", "App/Paste\\.swift"]
    excluded_match_kinds: [comment, doccomment, string]
    message: "Every paste is one transaction: run it through `ClipboardPaste.run(_:gate:)`, which owns the gate, the clipboard and the keys; a copy goes through `DictationPipeline.copyAgain`, so a waiting restore cannot overwrite it (docs/spec.md, \"Paste\")."
    severity: error
  # CODING_STANDARDS.md "User-facing text" rules 3, 4, 5, 8, 13 and 14, on UI strings in App/ only: strings on a line
  # that builds UI (Text(, Button(, NSMenuItem(title:, .toolTip = …), or on the line after its `(`, and every string in
  # App/StatusText.swift. Log strings are not on such lines, so they never trip these rules.
  # Each ui_text_* regex is `T(?<=<builders>…T)`: the target first, then a lookbehind that ends with the same target.
  # The engine tries the lookbehind only where the target matches; with the lookbehind first it runs at every
  # character, about 1-3 s per rule on App/ against 0.1-0.2 s. A lookbehind needs a bounded length, so a target has no
  # `+` or `*`. scripts/ui-text-builders.sh checks that every rule has this shape and the same builders.
  ui_text_ellipsis:
    name: "UI text: one-character ellipsis"
    included: ["App/.*\\.swift"]
    regex: "\\.\\.\\.(?<=(?:\\b(?:Text|Button|Toggle|Section|Label|Picker|LabeledContent|Link|Menu|TextField|SecureField|GroupBox|NSMenuItem|NSButton|NSTextField|NSAlert|MenuChoice|StepHeading|PageRow|PageHeader|ChartHeadline|PageSheet|help|navigationTitle|confirmationDialog|alert)\\(|\\.(?:title|subtitle|toolTip|messageText|informativeText|placeholderString|stringValue|prompt) = )(?:[ \\t]{0,4}\\n[ \\t]{0,40})?[^\\n]{0,200}\\.\\.\\.)"
    match_kinds: [string]
    message: "Use the one-character ellipsis \"…\", only on an item that opens a window or asks for more input (CODING_STANDARDS.md, User-facing text 3)."
    severity: error
  ui_text_internal_terms:
    name: "UI text: no internal terms"
    included: ["App/.*\\.swift"]
    regex: "(?i:\\b(?:routes?|keyterms?|ZDR|zero-data-retention|needsSetup|untested|(?:microsoft|x-ai|openai|google)/[\\w.-]{1,64})\\b)(?<=(?:\\b(?:Text|Button|Toggle|Section|Label|Picker|LabeledContent|Link|Menu|TextField|SecureField|GroupBox|NSMenuItem|NSButton|NSTextField|NSAlert|MenuChoice|StepHeading|PageRow|PageHeader|ChartHeadline|PageSheet|help|navigationTitle|confirmationDialog|alert)\\(|\\.(?:title|subtitle|toolTip|messageText|informativeText|placeholderString|stringValue|prompt) = )(?:[ \\t]{0,4}\\n[ \\t]{0,40})?[^\\n]{0,200}(?i:\\b(?:routes?|keyterms?|ZDR|zero-data-retention|needsSetup|untested|(?:microsoft|x-ai|openai|google)/[\\w.-]{1,64})\\b))"
    match_kinds: [string]
    message: "No internal terms in UI text: route, keyterm, ZDR, zero-data-retention, needsSetup, untested, model slugs (CODING_STANDARDS.md, User-facing text 5)."
    severity: error
  ui_text_dash:
    name: "UI text: no \" - \" between phrases"
    included: ["App/.*\\.swift"]
    regex: " - (?<=(?:\\b(?:Text|Button|Toggle|Section|Label|Picker|LabeledContent|Link|Menu|TextField|SecureField|GroupBox|NSMenuItem|NSButton|NSTextField|NSAlert|MenuChoice|StepHeading|PageRow|PageHeader|ChartHeadline|PageSheet|help|navigationTitle|confirmationDialog|alert)\\(|\\.(?:title|subtitle|toolTip|messageText|informativeText|placeholderString|stringValue|prompt) = )(?:[ \\t]{0,4}\\n[ \\t]{0,40})?[^\\n]{0,200} - )"
    match_kinds: [string]
    message: "No \" - \" between phrases in UI text: two sentences, a colon, or \"·\" before a value (CODING_STANDARDS.md, User-facing text 8)."
    severity: error
  ui_text_straight_quotes:
    name: "UI text: curly apostrophe and quotes"
    included: ["App/.*\\.swift"]
    regex: "(?:'|\\\\\")(?<=(?:\\b(?:Text|Button|Toggle|Section|Label|Picker|LabeledContent|Link|Menu|TextField|SecureField|GroupBox|NSMenuItem|NSButton|NSTextField|NSAlert|MenuChoice|StepHeading|PageRow|PageHeader|ChartHeadline|PageSheet|help|navigationTitle|confirmationDialog|alert)\\(|\\.(?:title|subtitle|toolTip|messageText|informativeText|placeholderString|stringValue|prompt) = )(?:[ \\t]{0,4}\\n[ \\t]{0,40})?[^\\n]{0,200}(?:'|\\\\\"))"
    match_kinds: [string]
    message: "Use the curly apostrophe and quotes (’ “ ”) in UI text, not ' or \\\" (CODING_STANDARDS.md, User-facing text 13)."
    severity: error
  # Rule 4 was broken in three phases ("Ctrl+Opt+Cmd", "Command-V", then "(Control-Option-Command)" on the 0.2.0 welcome
  # page, owner 2026-10-16): a modifier written as a word and joined to another key by "-", "+" or a space, in any case.
  ui_text_key_names:
    name: "UI text: keys as symbols"
    included: ["App/.*\\.swift"]
    regex: "(?i:\\b(?:Ctrl|Control|Opt|Option|Alt|Cmd|Command|Shift|Fn)[-+ ](?:Ctrl|Control|Opt|Option|Alt|Cmd|Command|Shift|Fn|Enter|Return|Escape|Esc|Tab|Space|Delete|Backspace|F\\d{1,2}|[A-Z0-9])\\b)(?<=(?:\\b(?:Text|Button|Toggle|Section|Label|Picker|LabeledContent|Link|Menu|TextField|SecureField|GroupBox|NSMenuItem|NSButton|NSTextField|NSAlert|MenuChoice|StepHeading|PageRow|PageHeader|ChartHeadline|PageSheet|help|navigationTitle|confirmationDialog|alert)\\(|\\.(?:title|subtitle|toolTip|messageText|informativeText|placeholderString|stringValue|prompt) = )(?:[ \\t]{0,4}\\n[ \\t]{0,40})?[^\\n]{0,200}(?i:\\b(?:Ctrl|Control|Opt|Option|Alt|Cmd|Command|Shift|Fn)[-+ ](?:Ctrl|Control|Opt|Option|Alt|Cmd|Command|Shift|Fn|Enter|Return|Escape|Esc|Tab|Space|Delete|Backspace|F\\d{1,2}|[A-Z0-9])\\b))"
    match_kinds: [string]
    message: "Write keys as symbols in UI text: ⌃ ⌥ ⌘ ⇧ fn, ⌘V, never \"Control-Option-Command\" or \"Cmd+V\" (CODING_STANDARDS.md, User-facing text 4)."
    severity: error
  ui_text_plain_words:
    name: "UI text: plain words"
    included: ["App/.*\\.swift"]
    regex: "(?i:\\b(?:we|our|(?-i:us)|please|(?:en|dis)abl(?:e|ed|es|ing)|toggl(?:e|ed|es|ing)|oops|whoops|uh-oh|sorry|yay|hooray|woohoo)\\b)(?<=(?:\\b(?:Text|Button|Toggle|Section|Label|Picker|LabeledContent|Link|Menu|TextField|SecureField|GroupBox|NSMenuItem|NSButton|NSTextField|NSAlert|MenuChoice|StepHeading|PageRow|PageHeader|ChartHeadline|PageSheet|help|navigationTitle|confirmationDialog|alert)\\(|\\.(?:title|subtitle|toolTip|messageText|informativeText|placeholderString|stringValue|prompt) = )(?:[ \\t]{0,4}\\n[ \\t]{0,40})?[^\\n]{0,200}(?i:\\b(?:we|our|(?-i:us)|please|(?:en|dis)abl(?:e|ed|es|ing)|toggl(?:e|ed|es|ing)|oops|whoops|uh-oh|sorry|yay|hooray|woohoo)\\b))"
    match_kinds: [string]
    message: "Plain words in UI text: no \"we\", no \"please\", no \"enable\", \"disable\" or \"toggle\" (name what is on: \"Keep filler words\"), no interjections such as \"oops\" or \"sorry\"; \"our\" and \"us\" also go (CODING_STANDARDS.md, User-facing text 14)."
    severity: error
  # What the shell shows is decided in KotobaCore's `ShellStatus` and tested there; these two files only collect its
  # facts and draw its output. b235fa0 and 3a9743b changed such rules here with no test: a pattern match on a state in
  # them is a decision no test covers.
  shell_adapters_decide_nothing:
    name: "Shell adapters decide nothing"
    included: ["App/AppDelegate\\.swift", "App/AppMenu\\.swift"]
    regex: "\\b(?:switch\\s|(?:if|guard|for)\\s+case\\b)"
    excluded_match_kinds: [comment, doccomment, string]
    message: "Decide what the menu bar icon, the menus, the Dock badge and the cues show in `ShellStatus` (KotobaCore), with a test; AppDelegate and AppMenu only collect its facts and draw its output (CODING_STANDARDS.md, Layout)."
    severity: error
  pill_action_carries_its_facts:
    name: "A pill action carries its facts"
    included: ["App/.*\\.swift"]
    regex: "\\bshell\\.dictation\\.(?:notice|phase)\\b"
    excluded_match_kinds: [comment, doccomment, string]
    message: "A pill button acts on what its `PillAction` carries (such as `.copy(id)`), not on the shell's last state: the next state can come between the draw and the click."
    severity: error
  # The 0.5.0 pill (docs/research/ui-redesign.md, "Pill"; <runbooks>/lint-proposal.md rules 4, 6 and 7). The snapshot
  # run checks what regex cannot: one glass view in the pill, no words in a live pill (App/IndicatorSnapshots.swift).
  ui_font_size_literal:
    name: "Type: text styles, not point sizes"
    included: ["App/.*\\.swift"]
    excluded: ["App/(?:\\w+/)?\\w*Snapshots\\.swift", "App/PillGeometry\\.swift"]
    regex: "\\.system\\(\\s*size\\s*:\\s*(?<![\\w.])(?:[1-9][\\d_]*(?:\\.\\d+)?|0\\.\\d*[1-9]\\d*)\\b|\\b\\w*[sS]ystemFont\\(ofSize\\s*:\\s*(?<![\\w.])(?:[1-9][\\d_]*(?:\\.\\d+)?|0\\.\\d*[1-9]\\d*)\\b|\\bpointSize\\s*:\\s*(?<![\\w.])(?:[1-9][\\d_]*(?:\\.\\d+)?|0\\.\\d*[1-9]\\d*)\\b"
    excluded_match_kinds: [comment, doccomment]
    message: "Use a text style (`.body`, `.callout`, `.headline`; `NSFont.preferredFont(forTextStyle:)`; `NSImage.SymbolConfiguration(textStyle:scale:)`), not a point size (HIG Typography), so a symbol takes the weight and scale of the text beside it."
    severity: error
  glass_on_navigation_layer_only:
    name: "Glass: navigation layer only, never glass on glass"
    included: ["App/.*\\.swift"]
    excluded: ["App/(?:\\w+/)?\\w*Snapshots\\.swift", "App/IndicatorDropTargets\\.swift"]
    regex: "\\.buttonStyle\\(\\s*\\.glass(?:Prominent)?\\b|\\.glassEffect\\s*\\(|\\bGlassEffectContainer\\b|\\bNSGlassEffect(?:Container)?View\\s*\\(|\\.bezelStyle\\s*=\\s*\\.glass\\b"
    excluded_match_kinds: [comment, doccomment, string]
    message: "Liquid Glass is for the navigation layer: the pill's one capsule, and the toolbar and sidebar that the system draws. Never put glass on glass: on the pill, a button uses a fill (WWDC25 219, HIG Materials). The pill's own glass has `// swiftlint:disable:this glass_on_navigation_layer_only`, its reason in its doc comment."
    severity: error
  pill_reads_pill_text:
    name: "Pill: words only when the user must know or act"
    included: ["App/(?:Pill|Indicator)\\w*\\.swift"]
    excluded: ["App/(?:\\w+/)?\\w*Snapshots\\.swift"]
    regex: "\\.statusText\\s*\\("
    excluded_match_kinds: [comment, doccomment, string]
    message: "The pill shows words only for an error, a silent mic, Secure Input, Undo, a learned word or the 10-minute timer. Read `pillText(_:)`; `statusText(_:)` is the menu's status line (docs/research/ui-redesign.md, Pill)."
    severity: error
  status_text_key_names:
    name: "Status text: keys as symbols"
    included: ["App/StatusText\\.swift", "KotobaCore/Sources/KotobaCore/ShellStatus\\.swift"]
    regex: "(?i:\\b(?:Ctrl|Control|Opt|Option|Alt|Cmd|Command|Shift|Fn)[-+ ](?:Ctrl|Control|Opt|Option|Alt|Cmd|Command|Shift|Fn|Enter|Return|Escape|Esc|Tab|Space|Delete|Backspace|F\\d+|[A-Z0-9])\\b)"
    match_kinds: [string]
    message: "Write keys as symbols in pill and menu text: ⌃ ⌥ ⌘ ⇧ fn, ⌘V (CODING_STANDARDS.md, User-facing text 4)."
    severity: error
  status_text_straight_quotes:
    name: "Status text: curly apostrophe and quotes"
    included: ["App/StatusText\\.swift", "KotobaCore/Sources/KotobaCore/ShellStatus\\.swift"]
    regex: "(?:'|\\\\\")"
    match_kinds: [string]
    message: "Use the curly apostrophe and quotes (’ “ ”) in pill and menu text, not ' or \\\" (CODING_STANDARDS.md, User-facing text 13)."
    severity: error
  status_text_ellipsis:
    name: "Status text: one-character ellipsis"
    included: ["App/StatusText\\.swift", "KotobaCore/Sources/KotobaCore/ShellStatus\\.swift"]
    regex: "\\.\\.\\."
    match_kinds: [string]
    message: "Use the one-character ellipsis \"…\" (CODING_STANDARDS.md, User-facing text 3)."
    severity: error
  status_text_internal_terms:
    name: "Status text: no internal terms"
    included: ["App/StatusText\\.swift", "KotobaCore/Sources/KotobaCore/ShellStatus\\.swift"]
    regex: "(?i:\\b(?:routes?|keyterms?|ZDR|zero-data-retention|needsSetup|untested|(?:microsoft|x-ai|openai|google)/[\\w.-]+)\\b)"
    match_kinds: [string]
    message: "No internal terms in pill or menu text (CODING_STANDARDS.md, User-facing text 5)."
    severity: error
  status_text_dash:
    name: "Status text: no \" - \" between phrases"
    included: ["App/StatusText\\.swift", "KotobaCore/Sources/KotobaCore/ShellStatus\\.swift"]
    regex: " - "
    match_kinds: [string]
    message: "No \" - \" between phrases in pill or menu text (CODING_STANDARDS.md, User-facing text 8)."
    severity: error
  status_text_plain_words:
    name: "Status text: plain words"
    included: ["App/StatusText\\.swift", "KotobaCore/Sources/KotobaCore/ShellStatus\\.swift"]
    regex: "(?i:\\b(?:we|our|(?-i:us)|please|(?:en|dis)abl(?:e|ed|es|ing)|toggl(?:e|ed|es|ing)|oops|whoops|uh-oh|sorry|yay|hooray|woohoo)\\b)"
    match_kinds: [string]
    message: "Plain words in pill and menu text: no \"we\", \"our\", \"us\", \"please\", \"enable\", \"disable\", \"toggle\" or interjections (CODING_STANDARDS.md, User-facing text 14)."
    severity: error
  # The mic input's lifecycle (which mic, when to rebuild, what waits for the end of a capture) lives in
  # KotobaCore's `AudioCapture`, tested through a fake. App/ only runs the hardware through `HALCaptureHardware`.
  status_text_press_not_tap:
    name: "Status text: press and hold, not tap"
    included: ["App/StatusText\\.swift", "KotobaCore/Sources/KotobaCore/ShellStatus\\.swift"]
    regex: "(?i:\\b(?:double-)?tap(?:s|ped|ping)?\\b)"
    match_kinds: [string]
    message: "Say “press” or “hold” for a key, not “tap”: “Press ⌃⌥⌘ to start, press it again to stop.” (CODING_STANDARDS.md, User-facing text 15)."
    severity: error
  live_state_in_ledger:
    name: "Live dictation state in LiveDictations"
    included: ["KotobaCore/Sources/KotobaCore/DictationPipeline\\.swift"]
    regex: "^    (?:private(?:\\(set\\))?\\s+)?var\\s+\\w+\\s*[:=]\\s*(?:Set<DictationID>|\\[DictationID\\s*:|LatencyLog\\b)"
    message: "What is live per dictation (its step, Return request, latency marks) and every wait on it lives in `LiveDictations`, so a dictation leaves every list at once and quit sees it (CODING_STANDARDS.md, Layout)."
    severity: error
  live_questions_to_ledger:
    name: "Ask LiveDictations what is live"
    included: ["KotobaCore/Sources/KotobaCore/(?:DictationPipeline|Pipeline\\w+)\\.swift"]
    regex: "\\b(?:recording|paused)\\s*[!=]=\\s*nil\\s*(?:,|&&|\\|\\|)\\s*(?:recording|paused)\\b"
    excluded_match_kinds: [comment, doccomment, string]
    message: "Ask `live` (`isQuiet`, `isDictationLive`, `hasRecording`) instead of combining the recording and the Undo window by hand."
    severity: error
  # Quit waits for billed work only when it is tracked as billed (`PendingWork.bill`); a ledger write in plain tracked
  # work or a bare task is lost at quit (CODING_STANDARDS.md, Layout).
  billed_work_is_billed:
    name: "Billed work runs as work.bill"
    included: ["KotobaCore/Sources/KotobaCore/.*\\.swift"]
    regex: "(?:\\.track\\b|\\bTask)\\s*(?:\\([^)]*\\))?\\s*\\{(?:(?!\\bfunc\\s|\\.track\\b|\\.bill\\b|\\bTask\\s*[({])[\\s\\S]){0,1500}?\\baddUsage"
    message: "A request whose cost goes to the usage ledger runs as `work.bill`, so quit waits for it (CODING_STANDARDS.md, Layout)."
    severity: error
  capture_lifecycle_in_core:
    name: "Capture lifecycle in KotobaCore"
    included: ["App/.*\\.swift"]
    excluded: ["App/HALCaptureHardware\\.swift"]
    regex: "\\b(?:HALInput|CaptureWriter|SettlingInput)\\s*\\(|\\bInputFormatPolicy\\s*\\.\\s*recovery\\b|\\bInputDevicePolicy\\s*\\.\\s*micInUse\\b"
    excluded_match_kinds: [comment, doccomment, string]
    message: "Mic input decisions live in KotobaCore's AudioCapture; App/ opens inputs and writers only in HALCaptureHardware, when the capture asks."
    severity: error
  # A dictation's phase (what is live) and its notices (one-shot outcomes) are two types, so "is a dictation live"
  # never reads a notice (CODING_STANDARDS.md, Layout).
  dictation_phase_cases:
    name: "Phases only in DictationPhase"
    included: ["KotobaCore/Sources/KotobaCore/DictationPhase\\.swift"]
    regex: "^\\s*case\\s+(?!(?:idle|recording|transcribing|cleaning|undoable|polishing)\\b)\\w+"
    excluded_match_kinds: [comment, doccomment, string]
    message: "A phase is a step a dictation or Polish stays live in. A one-shot outcome is a `DictationNotice`; a new phase is an owner decision, added to this rule's list."
    severity: error
  state_switch_has_no_default:
    name: "A switch over a phase or a notice names every case"
    included: ["App/.*\\.swift", "KotobaCore/Sources/KotobaCore/.*\\.swift"]
    # From the switch to its own closing brace, the line at the switch's indent (a closure's `}` in a case does not
    # end it), for a `default:` at that indent too (a nested switch's is deeper). No excluded_match_kinds: the match
    # spans the cases, so a string in any case would hide it.
    regex: "(?m)^( *)(?! )[^\\n]*\\bswitch\\s+[\\w.]*\\b(?:phase|notice)\\s*\\{(?:(?!\\n\\1\\}\\n)[\\s\\S])*?\\n\\1default\\s*:"
    message: "Name every `DictationPhase` or `DictationNotice` case, so a new one does not compile until each reader decides; to ask whether a dictation is live, read `phase.isLive`."
    severity: error

  # The 0.5.0 page system (CODING_STANDARDS.md, "Pages"; docs/research/ui-redesign.md). These cover the window code in
  # App/: the pill's files have their own rules (the pill rollout), and snapshot files set render sizes. A page not on
  # the system yet has a ratchet line (`// swiftlint:disable <rules>`) that its rollout removes;
  # `scripts/ratchet-done.sh` fails the release while one remains.
  ui_layout_literal:
    name: "Layout: no number in a SwiftUI layout modifier"
    included: ["App/.*\\.swift"]
    excluded: ["App/(?:\\w+/)?\\w*Snapshots\\.swift", "App/(?:Indicator|Pill)\\w*\\.swift", "App/Page/PageMetrics\\.swift"]
    regex: "(?:\\.padding\\((?:[^()\\n]*?,\\s*)?|\\.frame\\([^()\\n]*?\\b(?:width|height|minWidth|idealWidth|maxWidth|minHeight|idealHeight|maxHeight)\\s*:\\s*|\\b(?:spacing|cornerRadius|minLength)\\s*:\\s*|\\.(?:lineSpacing|offset)\\((?:[xy]\\s*:\\s*)?)[^,()\\n]*?(?<![\\w.])(?:[1-9][\\d_]*(?:\\.\\d+)?|0\\.\\d*[1-9]\\d*)\\b"
    excluded_match_kinds: [comment, doccomment]
    message: "No number in padding, frame, spacing or a corner radius. Let the system style set it (Form, Section, LabeledContent, controlSize, `.rect(corner: .containerConcentric)`), or name a value in `PageMetrics` (App/Page/PageMetrics.swift) with its source (CODING_STANDARDS.md, Pages). 0 is allowed."
    severity: error
  appkit_layout_literal:
    name: "Layout: no number in an AppKit inset, constant, size or radius"
    included: ["App/.*\\.swift"]
    excluded: ["App/(?:\\w+/)?\\w*Snapshots\\.swift", "App/(?:Indicator|Pill)\\w*\\.swift", "App/Page/.*\\.swift"]
    regex: "\\bNSEdgeInsets\\([^)\\n]*?(?<![\\w.])(?:[1-9][\\d_]*(?:\\.\\d+)?|0\\.\\d*[1-9]\\d*)\\b|\\bconstant\\s*:\\s*-?\\s*(?<![\\w.])(?:[1-9][\\d_]*(?:\\.\\d+)?|0\\.\\d*[1-9]\\d*)\\b|\\.cornerRadius\\s*=\\s*(?<![\\w.])(?:[1-9][\\d_]*(?:\\.\\d+)?|0\\.\\d*[1-9]\\d*)\\b|\\b(?:NSSize|CGSize|NSRect|CGRect)\\([^()\\n]*?\\b(?:width|height)\\s*:\\s*[^,()\\n]*?(?<![\\w.])(?:[1-9][\\d_]*(?:\\.\\d+)?|0\\.\\d*[1-9]\\d*)\\b"
    excluded_match_kinds: [comment, doccomment]
    message: "No number in an AppKit inset, constraint constant, size or corner radius. Name it in `PageMetrics` (App/Page/PageMetrics.swift) with its source, or let the system style set it (CODING_STANDARDS.md, Pages)."
    severity: error
  ui_layout_constant:
    name: "Layout: no CGFloat constant with a number outside the page system"
    included: ["App/.*\\.swift"]
    excluded: ["App/(?:\\w+/)?\\w*Snapshots\\.swift", "App/(?:Indicator|Pill)\\w*\\.swift", "App/Page/.*\\.swift"]
    regex: "\\b(?:let|var)\\s+\\w+\\s*:\\s*CGFloat\\s*=\\s*-?\\s*(?<![\\w.])(?:[1-9][\\d_]*(?:\\.\\d+)?|0\\.\\d*[1-9]\\d*)\\b"
    excluded_match_kinds: [comment, doccomment]
    message: "A CGFloat constant with a number is a hard-coded size with a name. Move it to `PageMetrics` (App/Page/PageMetrics.swift) with a one-line source, or use the system style (CODING_STANDARDS.md, Pages)."
    severity: error
  symbol_not_resizable:
    name: "Symbols: no .resizable() on an SF Symbol"
    included: ["App/.*\\.swift"]
    regex: "\\bImage\\(systemName:(?:(?!\\bImage\\(|\\n[ \\t]*\\n)[\\s\\S]){0,400}?\\.resizable\\(\\)"
    excluded_match_kinds: [comment, doccomment]
    message: "Do not call `.resizable()` on `Image(systemName:)`: it scales the glyph as a shape and loses its weight and optical size. Size a symbol with `.font(_:)` and `.imageScale(_:)`, at the weight of the text beside it; a tile is `SymbolTile` (HIG SF Symbols)."
    severity: error
  ui_divider:
    name: "Layout: grouped sections, not dividers"
    included: ["App/.*\\.swift"]
    excluded: ["App/(?:\\w+/)?\\w*Snapshots\\.swift", "App/(?:Indicator|Pill)\\w*\\.swift"]
    regex: "\\bDivider\\s*\\(\\s*\\)|\\bNSColor\\.separatorColor\\b|\\bNSBox\\s*\\("
    excluded_match_kinds: [comment, doccomment, string]
    message: "Grouped sections separate the content (Form, Section, List). Do not add a `Divider()` or draw a separator (CODING_STANDARDS.md, Pages)."
    severity: error
  ui_fixed_color:
    name: "Color: system colors only"
    included: ["App/.*\\.swift"]
    excluded: ["App/(?:\\w+/)?\\w*Snapshots\\.swift", "App/(?:Indicator|Pill)\\w*\\.swift"]
    regex: "\\b(?:Color|NSColor)\\((?:red|white|hue|calibratedRed|srgbRed|deviceRed)\\s*:|\\b(?:Color|NSColor)\\.(?:black|white|gray|grey|darkGray|lightGray)\\b|\\.(?:foregroundStyle|foregroundColor|fill|tint)\\(\\s*\\.(?:black|white|gray)\\s*\\)"
    excluded_match_kinds: [comment, doccomment, string]
    message: "Take colors from the system: `.primary`, `.secondary`, `.tint`, semantic NSColors (`labelColor`, `secondaryLabelColor`), or `Color.brand` for charts. A tile's white glyph is `SymbolTile` (CODING_STANDARDS.md, Pages)."
    severity: error
  row_is_page_row:
    name: "Pages: a row with a title and a subtitle is a PageRow"
    included: ["App/.*\\.swift"]
    excluded: ["App/(?:\\w+/)?\\w*Snapshots\\.swift", "App/(?:Indicator|Pill)\\w*\\.swift", "App/Page/.*\\.swift"]
    regex: "(?:\\blabel:|\\bLabel|\\bToggle\\([^)\\n]*\\))\\s*\\{\\s*Text\\([^\\n]*\\n\\s*Text\\("
    message: "A row with a title and a grey subtitle is `PageRow(title:subtitle:icon:trailing:)`, and a switch with one is `PageToggle(title:subtitle:isOn:)`: they centre an icon on both lines and put the trailing content where System Settings does (CODING_STANDARDS.md, Pages). A `LabeledContent`, `Label` or `Toggle` with two Texts drifts from them."
    severity: error
  page_form:
    name: "Pages: a grouped form is a PageForm"
    included: ["App/.*\\.swift"]
    excluded: ["App/(?:\\w+/)?\\w*Snapshots\\.swift", "App/(?:Indicator|Pill)\\w*\\.swift", "App/Page/.*\\.swift"]
    regex: "\\.formStyle\\(\\s*\\.grouped\\s*\\)"
    excluded_match_kinds: [comment, doccomment, string]
    message: "A page is a `PageForm` (its sections stay in the centred column) and a sheet is a `PageSheet`; do not build a grouped form of your own (CODING_STANDARDS.md, Pages)."
    severity: error
